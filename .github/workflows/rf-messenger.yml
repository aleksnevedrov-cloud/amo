name: rf-messenger

on:
  push:
    branches: [main]
    paths: ['rf-messenger/**', '.github/workflows/rf-messenger.yml']
  pull_request:
    paths: ['rf-messenger/**', '.github/workflows/rf-messenger.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rf-messenger
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aidoor
          POSTGRES_PASSWORD: aidoor
          POSTGRES_DB: aidoor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aidoor" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://aidoor:aidoor@localhost:5432/aidoor_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: rf-messenger/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rf-messenger/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: rf-messenger-widget-zip
          path: rf-messenger/widget/dist/widget.zip
