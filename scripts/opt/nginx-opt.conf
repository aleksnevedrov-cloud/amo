# /etc/nginx/conf.d/agent-opt.conf — отдельный server-блок для «Агента опт». Розничный блок ai-door.conf не меняется.
# После копирования: nginx -t && systemctl reload nginx; затем certbot --nginx -d opt.rf-dveri.ru (добавит listen 443 и редирект).
server {
  listen 80;
  server_name opt.rf-dveri.ru;

  location / {
    proxy_pass http://127.0.0.1:3001;          # API_PORT из /opt/agent-opt/.env
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;                   # сборка документа с PDF через LibreOffice
    client_max_body_size 32m;                  # шаблон КП и файлы базы знаний в JSON
  }
}
