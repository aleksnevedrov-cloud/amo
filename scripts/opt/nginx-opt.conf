# /etc/nginx/sites-available/agent-opt (симлинк в sites-enabled) — отдельный server-блок для «Агента опт».
# Розничный блок /etc/nginx/sites-enabled/ai-door не меняется.
# Сертификат opt.rf-dveri.ru уже выпущен (certbot certonly) — здесь только пути к нему, certbot не запускается.
# После копирования: nginx -t && systemctl reload nginx.

# HTTP → HTTPS. Путь /.well-known нужен certbot для продления сертификата.
server {
  listen 80;
  server_name opt.rf-dveri.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name opt.rf-dveri.ru;

  ssl_certificate     /etc/letsencrypt/live/opt.rf-dveri.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/opt.rf-dveri.ru/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;      # как у ai.rf-dveri.ru
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;        # как у ai.rf-dveri.ru

  # Архив виджета опта для карточки интеграции amoCRM (шаг 6 плана этапа 4): https://opt.rf-dveri.ru/dl/widget-opt-7c1e.zip
  # Хеш в имени меняется при каждой новой сборке — обновить и здесь, и в карточке интеграции.
  location = /dl/widget-opt-7c1e.zip {
    alias /opt/agent-opt/dl/widget-opt-7c1e.zip;
    types { application/zip zip; }
    default_type application/zip;
  }

  location / {
    proxy_pass http://127.0.0.1:3001;          # API_PORT из /opt/agent-opt/.env
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;                   # сборка документа с PDF через LibreOffice
    client_max_body_size 32m;                  # шаблон КП в JSON (base64)
  }
}
